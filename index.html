    // --- 메인 APP 컴포넌트 ---
    function App() {
      const [activeTab, setActiveTab] = useState('explore');
      const [isTeacherAuth, setIsTeacherAuth] = useState(false);
      const [showAuthModal, setShowAuthModal] = useState(false);
      const [pinInput, setPinInput] = useState('');
      const [pinError, setPinError] = useState(false);
      const [teacherPin, setTeacherPin] = useState(() => localStorage.getItem('h_pin') || '1234');

      const [units, setUnits] = useState(() => {
        const s = localStorage.getItem('h_units');
        return s ? JSON.parse(s) : INITIAL_UNITS;
      });
      const [quizBank, setQuizBank] = useState(() => {
        const s = localStorage.getItem('h_quiz');
        return s ? JSON.parse(s) : INITIAL_QUIZ_BANK;
      });
      // 전체 학생 성적 목록 (교사 전용)
      const [submissions, setSubmissions] = useState(() => {
        const s = localStorage.getItem('h_subs');
        return s ? JSON.parse(s) : INITIAL_SUBMISSIONS;
      });
      // 현재 학생 개인의 성적 목록 (학생 전용)
      const [mySubmissions, setMySubmissions] = useState(() => {
        const s = localStorage.getItem('h_my_subs');
        return s ? JSON.parse(s) : [];
      });

      useEffect(() => { localStorage.setItem('h_units', JSON.stringify(units)); }, [units]);
      useEffect(() => { localStorage.setItem('h_quiz', JSON.stringify(quizBank)); }, [quizBank]);
      useEffect(() => { localStorage.setItem('h_subs', JSON.stringify(submissions)); }, [submissions]);
      useEffect(() => { localStorage.setItem('h_my_subs', JSON.stringify(mySubmissions)); }, [mySubmissions]);
      useEffect(() => { localStorage.setItem('h_pin', teacherPin); }, [teacherPin]);

      // 교사 비밀번호 인증 핸들러
      const handleAuthSubmit = (e) => {
        e.preventDefault();
        if (pinInput.trim() === teacherPin.trim()) {
          setIsTeacherAuth(true);
          setShowAuthModal(false);
          setPinInput('');
          setPinError(false);
          setActiveTab('admin');
        } else {
          setPinError(true);
        }
      };

      const handleLogoutTeacher = () => {
        setIsTeacherAuth(false);
        setActiveTab('explore');
      };

      // 성적표 CSV 다운로드
      const handleExportCSV = () => {
        const headers = ['제출ID', '학생이름', '학급/번호', '취득점수', '총점', '백분율(%)', '제출일시', '소요시간(초)'];
        const rows = submissions.map(s => [
          s.id, `"${s.studentName}"`, `"${s.studentClass}"`, s.score, s.totalPoints, s.percentage, `"${s.completedAt}"`, s.timeSpentSeconds
        ]);
        const csvContent = '\uFEFF' + [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `맞춤법_전체성적_${new Date().toISOString().split('T')[0]}.csv`;
        a.click();
      };

      return (
        <div className="min-h-screen flex flex-col">
          {/* 상단 네비게이션 헤더 */}
          <header className="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-200">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-6">
              <div className="flex items-center gap-3">
                <div className="w-9 h-9 rounded-lg bg-indigo-600 flex items-center justify-center text-white font-extrabold text-lg shadow-sm">
                  한
                </div>
                <button onClick={() => setActiveTab('explore')} className="text-lg font-bold text-slate-900 hover:text-indigo-600 transition-colors">
                  바른 국어생활
                </button>
                <span className="hidden sm:inline-block text-xs text-slate-400 border-l border-slate-200 pl-3">
                  고등 국어 02. 한글 맞춤법과 국어생활
                </span>
              </div>

              {/* 학생 화면 네비게이션: 교사 전환 버튼이나 관리자 탭 완전 숨김 */}
              <nav className="flex items-center gap-4 text-xs sm:text-sm font-semibold text-slate-600">
                <button
                  onClick={() => setActiveTab('explore')}
                  className={`py-1.5 px-2 transition-colors ${activeTab === 'explore' ? 'text-indigo-600 font-bold border-b-2 border-indigo-600' : 'hover:text-slate-900'}`}
                >
                  수업 탐구
                </button>
                <button
                  onClick={() => setActiveTab('quiz')}
                  className={`py-1.5 px-2 transition-colors ${activeTab === 'quiz' ? 'text-indigo-600 font-bold border-b-2 border-indigo-600' : 'hover:text-slate-900'}`}
                >
                  인터랙티브 퀴즈
                </button>
                <button
                  onClick={() => setActiveTab('reflection')}
                  className={`py-1.5 px-2 transition-colors ${activeTab === 'reflection' ? 'text-indigo-600 font-bold border-b-2 border-indigo-600' : 'hover:text-slate-900'}`}
                >
                  국어생활 성찰
                </button>
                {/* 학생 개인 전용 성적표 (타 학생 데이터 절대 미노출) */}
                <button
                  onClick={() => setActiveTab('my-report')}
                  className={`py-1.5 px-2 transition-colors ${activeTab === 'my-report' ? 'text-indigo-600 font-bold border-b-2 border-indigo-600' : 'hover:text-slate-900'}`}
                >
                  나의 성적표
                </button>
                {/* 교사 인증 시에만 관리자 탭 활성화 */}
                {isTeacherAuth && (
                  <button
                    onClick={() => setActiveTab('admin')}
                    className={`py-1.5 px-2 transition-colors ${activeTab === 'admin' ? 'text-amber-600 font-bold border-b-2 border-amber-600' : 'hover:text-slate-900'}`}
                  >
                    교사용 대시보드
                  </button>
                )}
              </nav>

              <div className="flex items-center gap-2">
                {isTeacherAuth ? (
                  <button
                    onClick={handleLogoutTeacher}
                    className="px-3 py-1.5 text-xs font-bold rounded-lg border border-rose-200 bg-rose-50 hover:bg-rose-100 text-rose-700 transition-colors"
                  >
                    교사 모드 종료
                  </button>
                ) : (
                  <span className="text-[11px] font-medium text-slate-400 bg-slate-100 px-2.5 py-1 rounded">
                    학생 학습 모드
                  </span>
                )}
              </div>
            </div>
          </header>

          {/* 메인 콘텐츠 영역 */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
            {activeTab === 'explore' && <ExploreSection onGoQuiz={() => setActiveTab('quiz')} />}
            {activeTab === 'quiz' && (
              <QuizSection
                quizBank={quizBank}
                onSaveSubmission={(sub) => {
                  setSubmissions([sub, ...submissions]);
                  setMySubmissions([sub, ...mySubmissions]);
                }}
              />
            )}
            {activeTab === 'reflection' && <ReflectionSection />}
            {activeTab === 'my-report' && <MyReportSection mySubmissions={mySubmissions} onGoQuiz={() => setActiveTab('quiz')} />}
            {activeTab === 'admin' && (isTeacherAuth ? (
              <AdminSection
                submissions={submissions}
                units={units}
                quizBank={quizBank}
                teacherPin={teacherPin}
                onUpdatePin={(p) => setTeacherPin(p)}
                onExportCSV={handleExportCSV}
                onAddUnit={(newU) => setUnits([...units, newU])}
                onAddQuiz={(newQ) => setQuizBank([...quizBank, newQ])}
                onMockSubs={() => {
                  const names = ['송지후', '한채원', '배준서', '오수아', '임도윤'];
                  const mocks = names.map((name, i) => ({
                    id: `mock-${Date.now()}-${i}`,
                    studentName: name,
                    studentClass: `2학년 1반 ${i + 15}번`,
                    score: (7 + (i % 4)) * 10,
                    totalPoints: 100,
                    percentage: (7 + (i % 4)) * 10,
                    completedAt: '2026-03-12 16:30',
                    timeSpentSeconds: 160 + i * 20
                  }));
                  setSubmissions([...mocks, ...submissions]);
                }}
              />
            ) : <ExploreSection onGoQuiz={() => setActiveTab('quiz')} />)}
          </main>

          {/* 푸터 (조용한 교사 전용 인증 링크) */}
          <footer className="border-t border-slate-200 bg-white py-4 px-6 flex items-center justify-between text-xs text-slate-500">
            <span>바른 국어생활 · 단일 HTML 파일 독립 실행형 웹앱</span>
            <div>
              {isTeacherAuth ? (
                <button onClick={handleLogoutTeacher} className="text-rose-600 font-bold hover:underline">
                  교사 모드 활성화됨 (종료)
                </button>
              ) : (
                <button onClick={() => setShowAuthModal(true)} className="text-slate-400 hover:text-slate-600 transition-colors">
                  🔒 교사 전용 인증
                </button>
              )}
            </div>
          </footer>

          {/* 교사 비밀번호 인증 모달 */}
          {showAuthModal && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl p-6 max-w-xs w-full space-y-4 shadow-xl border">
                <div className="flex items-center justify-between pb-2 border-b">
                  <h4 className="font-bold text-slate-900 text-sm">교사 전용 비밀번호 인증</h4>
                  <button onClick={() => setShowAuthModal(false)} className="text-slate-400 hover:text-slate-600 text-sm">✕</button>
                </div>
                <p className="text-xs text-slate-500">학생들의 성적 보호를 위해 교사 비밀번호를 입력하세요. (초기 비밀번호: <strong>1234</strong>)</p>
                <form onSubmit={handleAuthSubmit} className="space-y-3">
                  <input
                    type="password"
                    value={pinInput}
                    onChange={e => { setPinInput(e.target.value); setPinError(false); }}
                    placeholder="비밀번호 입력"
                    className="w-full p-2 border rounded-lg text-center font-bold tracking-widest text-sm focus:outline-none focus:ring-1 focus:ring-indigo-500"
                    autoFocus
                  />
                  {pinError && <p className="text-[11px] text-rose-600 font-bold">비밀번호가 일치하지 않습니다.</p>}
                  <div className="flex gap-2">
                    <button type="button" onClick={() => setShowAuthModal(false)} className="flex-1 py-1.5 border rounded text-xs">취소</button>
                    <button type="submit" className="flex-1 py-1.5 bg-indigo-600 text-white font-bold rounded text-xs hover:bg-indigo-700">확인</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    // --- 학생 개인 전용 성적표 (타 학생 데이터 절대 미노출) ---
    function MyReportSection({ mySubmissions, onGoQuiz }) {
      if (mySubmissions.length === 0) {
        return (
          <div className="bg-white rounded-2xl border p-8 text-center max-w-md mx-auto space-y-4 shadow-sm">
            <h3 className="font-bold text-slate-900 text-lg">아직 제출한 퀴즈 기록이 없습니다</h3>
            <p className="text-xs text-slate-500 leading-relaxed">
              [인터랙티브 퀴즈] 탭에서 한글 맞춤법 퀴즈를 풀고 제출하면 나만의 성적과 오답노트를 안전하게 확인할 수 있습니다.
            </p>
            <button onClick={onGoQuiz} className="px-5 py-2.5 bg-indigo-600 text-white font-bold rounded-xl text-xs hover:bg-indigo-700 transition-colors">
              퀴즈 풀러 가기
            </button>
          </div>
        );
      }

      const latest = mySubmissions[0];

      return (
        <div className="bg-white rounded-2xl border p-6 space-y-6 max-w-2xl mx-auto shadow-sm">
          <div className="border-b pb-3 flex items-center justify-between">
            <div>
              <span className="text-xs font-bold text-indigo-600">학생 개인 학습 기록</span>
              <h2 className="text-lg font-bold text-slate-900">나의 맞춤법 퀴즈 성적표</h2>
              <p className="text-[11px] text-slate-400 mt-0.5">* 오직 본인의 성적만 표시되며 타 학생에게는 공개되지 않습니다.</p>
            </div>
            <button onClick={() => window.print()} className="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-lg">
              인쇄
            </button>
          </div>

          <div className="bg-gradient-to-r from-indigo-900 to-slate-900 text-white rounded-xl p-5 flex items-center justify-between">
            <div>
              <span className="text-xs text-yellow-400 font-bold">최근 응시 성적</span>
              <h3 className="text-2xl font-black">{latest.studentName} 학생: {latest.percentage}점</h3>
              <div className="text-xs text-slate-300 mt-1">{latest.studentClass} · {latest.completedAt}</div>
            </div>
            <div className="text-right">
              <div className="text-2xl font-black text-yellow-400 font-mono">{latest.score} / {latest.totalPoints}점</div>
            </div>
          </div>

          <div className="space-y-3">
            <h4 className="font-bold text-xs text-slate-800">나의 응시 이력 ({mySubmissions.length}회)</h4>
            <div className="space-y-2">
              {mySubmissions.map((s, idx) => (
                <div key={s.id} className="p-3 bg-slate-50 border rounded-xl flex items-center justify-between text-xs">
                  <div>
                    <span className="font-bold text-slate-800">제{mySubmissions.length - idx}회차 응시</span>
                    <span className="text-slate-400 text-[11px] ml-2">({s.completedAt})</span>
                  </div>
                  <div className="font-bold text-indigo-600 font-mono text-sm">{s.percentage}점 ({s.score}점)</div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // --- 수업 탐구 섹션 ---
    function ExploreSection({ onGoQuiz }) {
      const [saiPair, setSaiPair] = useState('귓밥 / 귀밥');
      const saiCases = {
        '귓밥 / 귀밥': { step1: true, step2: true, step3: true, correct: '귓밥', reason: "고유어 합성어(귀+밥) + 앞말 모음(ㅟ) 끝 + 된소리 [귀빱] 발음" },
        '해님 / 햇님': { step1: false, step2: true, step3: false, correct: '해님', reason: "명사 '해' + 접미사 '-님'의 '파생어'이므로 사이시옷 탈락!" },
        '수도물 / 수돗물': { step1: true, step2: true, step3: true, correct: '수돗물', reason: "한자어(수도) + 고유어(물) + 앞말 모음(ㅗ) + 'ㄴ' 덧남 [수돈물]" },
        '뒤일 / 뒷일': { step1: true, step2: true, step3: true, correct: '뒷일', reason: "고유어 합성어(뒤+일) + 앞말 모음(ㅟ) + 'ㄴㄴ' 덧남 [뒨ː닐]" },
        '개수 / 갯수 (個數)': { step1: false, step2: true, step3: false, correct: '개수 (個數)', reason: "둘 다 한자어(개+수)이며 6개 예외에 해당하지 않아 사이시옷 탈락!" }
      };

      const curSai = saiCases[saiPair];

      return (
        <div className="space-y-8">
          <div className="bg-gradient-to-r from-indigo-900 to-slate-900 text-white rounded-2xl p-6 sm:p-8 flex flex-col sm:flex-row items-center justify-between gap-6 shadow-md">
            <div>
              <span className="text-xs font-bold text-yellow-400">고등 국어 (2022 개정) · 4단원 살아 숨 쉬는 국어와 매체</span>
              <h1 className="text-2xl sm:text-3xl font-extrabold mt-1">02. 한글 맞춤법과 국어생활</h1>
              <p className="text-xs sm:text-sm text-slate-300 mt-2 max-w-xl leading-relaxed">
                표준어를 소리대로 적되 어법에 맞도록 함을 원칙으로 하는 한글 맞춤법의 기본 원리와 사이시옷, 띄어쓰기 규정을 탐구합니다.
              </p>
            </div>
            <button
              onClick={onGoQuiz}
              className="px-5 py-3 bg-yellow-400 hover:bg-yellow-300 text-slate-950 font-bold text-xs sm:text-sm rounded-xl shadow-lg shrink-0 transition-transform active:scale-95"
            >
              형성평가 퀴즈 풀기 →
            </button>
          </div>

          {/* 맞춤법 총칙 모듈 */}
          <div className="bg-white rounded-2xl border border-slate-200 p-6 space-y-4 shadow-sm">
            <div className="border-b border-slate-100 pb-3">
              <span className="text-xs font-bold text-indigo-600">학습 모듈 01</span>
              <h3 className="text-lg font-bold text-slate-900">맞춤법 총칙과 기본 원리</h3>
              <p className="text-xs text-slate-500 mt-1">
                <strong>총칙 제1항:</strong> 표준어를 소리대로 적되, 어법에 맞도록 함을 원칙으로 한다.<br/>
                <strong>어법에 맞게 적는 이유:</strong> 형태소 본 모양을 고정하여 의미 파악을 용이하게 함 (예: 꽃이[꼬치], 꽃만[꼰만]).
              </p>
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 text-xs">
              <div className="bg-slate-50 p-3.5 rounded-xl border border-slate-200">
                <div className="font-bold text-indigo-700">제5항 된소리 표기</div>
                <div className="mt-1 text-slate-600">
                  'ㄱ, ㅂ' 받침 뒤 된소리는 예사소리로 적음: <strong>깍두기</strong>[깍뚜기], <strong>싹둑</strong>[싹뚝], <strong>법석</strong>[법썩]
                </div>
              </div>
              <div className="bg-slate-50 p-3.5 rounded-xl border border-slate-200">
                <div className="font-bold text-indigo-700">제6항 구개음화 표기</div>
                <div className="mt-1 text-slate-600">
                  'ㄷ, ㅌ' 받침 뒤 '이/히' 결합 시 원형 밝힘: <strong>해돋이</strong>[해도지], <strong>같이</strong>[가치], <strong>닫혀서</strong>[다쳐서]
                </div>
              </div>
              <div className="bg-slate-50 p-3.5 rounded-xl border border-slate-200">
                <div className="font-bold text-indigo-700">제11항 -률/-율 표기</div>
                <div className="mt-1 text-slate-600">
                  모음이나 'ㄴ' 받침 뒤는 <strong>'열, 율'</strong>(백분율, 실패율), 그 외는 <strong>'렬, 률'</strong>(성공률, 합격률)
                </div>
              </div>
            </div>
          </div>

          {/* 사이시옷 3단계 판별기 */}
          <div className="bg-white rounded-2xl border border-slate-200 p-6 space-y-4 shadow-sm">
            <div className="border-b border-slate-100 pb-3">
              <span className="text-xs font-bold text-indigo-600">학습 모듈 02</span>
              <h3 className="text-lg font-bold text-slate-900">제30항 사이시옷 3단계 판별 알고리즘</h3>
              <p className="text-xs text-slate-500 mt-1">단어를 클릭하여 3단계 조건을 순서대로 검증해 보세요.</p>
            </div>

            <div className="flex flex-wrap gap-2">
              {Object.keys(saiCases).map(pair => (
                <button
                  key={pair}
                  onClick={() => setSaiPair(pair)}
                  className={`px-3 py-1.5 text-xs font-bold rounded-lg transition-all ${
                    saiPair === pair ? 'bg-indigo-600 text-white shadow' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'
                  }`}
                >
                  {pair}
                </button>
              ))}
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 text-xs">
              <div className={`p-3.5 rounded-xl border ${curSai.step1 ? 'bg-emerald-50 border-emerald-300' : 'bg-rose-50 border-rose-300'}`}>
                <div className="font-bold text-slate-700">1단계 : 고유어 포함 합성어인가?</div>
                <div className="mt-1 font-extrabold text-sm">{curSai.step1 ? '✅ 통과 (예)' : '❌ 탈락 (아니요)'}</div>
              </div>
              <div className={`p-3.5 rounded-xl border ${curSai.step2 ? 'bg-emerald-50 border-emerald-300' : 'bg-rose-50 border-rose-300'}`}>
                <div className="font-bold text-slate-700">2단계 : 앞 단어가 모음으로 끝나는가?</div>
                <div className="mt-1 font-extrabold text-sm">{curSai.step2 ? '✅ 통과 (예)' : '❌ 탈락 (아니요)'}</div>
              </div>
              <div className={`p-3.5 rounded-xl border ${curSai.step3 ? 'bg-emerald-50 border-emerald-300' : 'bg-rose-50 border-rose-300'}`}>
                <div className="font-bold text-slate-700">3단계 : 소리가 덧나는가?</div>
                <div className="mt-1 font-extrabold text-sm">{curSai.step3 ? '✅ 충족 (된소리/ㄴ/ㄴㄴ)' : '❌ 미충족'}</div>
              </div>
            </div>

            <div className="bg-slate-900 text-white p-4 rounded-xl flex items-center justify-between text-xs">
              <div>
                <span className="text-slate-400">최종 올바른 표기:</span>
                <span className="text-base font-black text-yellow-400 ml-2">{curSai.correct}</span>
                <p className="text-[11px] text-slate-300 mt-1">{curSai.reason}</p>
              </div>
            </div>

            <div className="bg-amber-50 border border-amber-200 p-3 rounded-xl text-xs text-amber-900">
              <strong>★ 암기 필수 한자어 예외 6개 (제30항):</strong> 곳간(庫間), 찻간(車間), 툇간(退間), 셋방(貰房), 숫자(數字), 횟수(回數)
            </div>
          </div>

          {/* 띄어쓰기 비교기 */}
          <div className="bg-white rounded-2xl border border-slate-200 p-6 space-y-4 shadow-sm">
            <div className="border-b border-slate-100 pb-3">
              <span className="text-xs font-bold text-indigo-600">학습 모듈 03</span>
              <h3 className="text-lg font-bold text-slate-900">형태가 같은 조사 vs 의존 명사 띄어쓰기</h3>
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs">
              <div className="p-4 rounded-xl bg-blue-50 border border-blue-200">
                <span className="font-bold text-blue-900">제41항 조사 (앞말에 붙여 씀)</span>
                <ul className="mt-2 space-y-1.5 text-slate-700">
                  <li>• <strong>너만큼</strong> 키가 크다 (체언 뒤)</li>
                  <li>• <strong>너대로</strong> 해라 (체언 뒤)</li>
                  <li>• 믿을 사람은 <strong>너뿐이다</strong> (체언 뒤)</li>
                  <li>• <strong>너밖에</strong> 없다 (부정어 호응 보조사)</li>
                </ul>
              </div>
              <div className="p-4 rounded-xl bg-emerald-50 border border-emerald-200">
                <span className="font-bold text-emerald-900">제42항 의존 명사 (앞말과 띄어 씀)</span>
                <ul className="mt-2 space-y-1.5 text-slate-700">
                  <li>• <strong>먹을 만큼</strong> 먹어라 (관형어 뒤)</li>
                  <li>• <strong>약속한 대로</strong> 했다 (관형어 뒤)</li>
                  <li>• 그냥 <strong>웃을 뿐이다</strong> (관형어 뒤)</li>
                  <li>• 시작한 <strong>지</strong> 이틀째 / 일주일 <strong>만에</strong> (시간 경과)</li>
                </ul>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // --- 인터랙티브 퀴즈 섹션 ---
    function QuizSection({ quizBank, onSaveSubmission }) {
      const [curIdx, setCurIdx] = useState(0);
      const [answers, setAnswers] = useState({});
      const [studentName, setStudentName] = useState('김학생');
      const [studentClass, setStudentClass] = useState('2학년 1반 15번');
      const [result, setResult] = useState(null);

      const q = quizBank[curIdx];
      const handleAnswer = (val) => { setAnswers({ ...answers, [q.id]: val }); };

      const handleSubmit = () => {
        let score = 0;
        quizBank.forEach(item => {
          if (answers[item.id] === item.correctAnswer) {
            score += item.points;
          }
        });
        const final = {
          id: `sub-${Date.now()}`,
          studentName,
          studentClass,
          score,
          totalPoints: quizBank.length * 10,
          percentage: Math.round((score / (quizBank.length * 10)) * 100),
          completedAt: new Date().toLocaleString(),
          timeSpentSeconds: 150
        };
        setResult(final);
        onSaveSubmission(final);
        if (final.percentage >= 80 && window.confetti) {
          window.confetti();
        }
      };

      if (result) {
        return (
          <div className="bg-white rounded-2xl border border-slate-200 p-8 shadow-sm space-y-6 text-center max-w-xl mx-auto">
            <span className="text-xs font-bold text-indigo-600 uppercase">형성평가 결과</span>
            <h2 className="text-3xl font-black text-slate-900">{result.studentName} 학생: {result.score}점!</h2>
            <p className="text-xs text-slate-500">
              정답률 {result.percentage}% ({result.score} / {result.totalPoints}점)
            </p>
            <button
              onClick={() => { setResult(null); setAnswers({}); setCurIdx(0); }}
              className="px-6 py-2.5 bg-indigo-600 text-white font-bold text-xs rounded-xl hover:bg-indigo-700 transition-colors"
            >
              다시 풀기
            </button>
          </div>
        );
      }

      return (
        <div className="bg-white rounded-2xl border border-slate-200 p-6 sm:p-8 shadow-sm space-y-6 max-w-2xl mx-auto">
          <div className="flex items-center justify-between pb-4 border-b border-slate-100 text-xs">
            <div className="flex items-center gap-2">
              <span className="font-bold text-indigo-600">문항 {curIdx + 1} / {quizBank.length}</span>
              <span className="text-slate-400 font-mono">[{q.ruleCitation}]</span>
            </div>
            <div className="flex items-center gap-2">
              <input
                type="text"
                value={studentName}
                onChange={e => setStudentName(e.target.value)}
                className="w-16 p-1 border rounded text-xs font-bold"
                placeholder="이름"
              />
              <input
                type="text"
                value={studentClass}
                onChange={e => setStudentClass(e.target.value)}
                className="w-24 p-1 border rounded text-xs"
                placeholder="학번"
              />
            </div>
          </div>

          <div className="space-y-3">
            <h3 className="text-base sm:text-lg font-bold text-slate-900">{q.question}</h3>
            {q.sentence && (
              <div className="p-3.5 bg-slate-50 rounded-xl border border-slate-200 text-sm font-semibold text-slate-800">
                {q.sentence}
              </div>
            )}
          </div>

          {q.type === 'ox' ? (
            <div className="grid grid-cols-2 gap-4">
              <button
                onClick={() => handleAnswer(true)}
                className={`p-4 rounded-xl border text-center font-bold text-lg transition-all ${
                  answers[q.id] === true ? 'bg-indigo-600 text-white' : 'bg-white hover:bg-slate-50'
                }`}
              >
                O (맞음)
              </button>
              <button
                onClick={() => handleAnswer(false)}
                className={`p-4 rounded-xl border text-center font-bold text-lg transition-all ${
                  answers[q.id] === false ? 'bg-indigo-600 text-white' : 'bg-white hover:bg-slate-50'
                }`}
              >
                X (틀림)
              </button>
            </div>
          ) : (
            <div className="grid grid-cols-2 gap-3">
              {q.options.map((opt, i) => (
                <button
                  key={i}
                  onClick={() => handleAnswer(i)}
                  className={`p-3.5 rounded-xl border text-left font-semibold text-xs sm:text-sm transition-all ${
                    answers[q.id] === i ? 'bg-indigo-600 text-white' : 'bg-white hover:bg-slate-50'
                  }`}
                >
                  {i + 1}. {opt}
                </button>
              ))}
            </div>
          )}

          {answers[q.id] !== undefined && (
            <div className="p-3 bg-slate-50 rounded-lg border text-xs text-slate-700 leading-relaxed">
              <strong>💡 해설:</strong> {q.explanation}
            </div>
          )}

          <div className="flex items-center justify-between pt-4 border-t border-slate-100 text-xs font-semibold">
            <button
              disabled={curIdx === 0}
              onClick={() => setCurIdx(curIdx - 1)}
              className="px-3 py-1.5 border rounded disabled:opacity-30"
            >
              이전
            </button>
            {curIdx < quizBank.length - 1 ? (
              <button
                onClick={() => setCurIdx(curIdx + 1)}
                className="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700"
              >
                다음 문항 →
              </button>
            ) : (
              <button
                onClick={handleSubmit}
                className="px-5 py-2 bg-emerald-600 text-white rounded-lg hover:bg-emerald-700"
              >
                최종 제출 및 채점
              </button>
            )}
          </div>
        </div>
      );
    }

    // --- 국어생활 성찰 섹션 ---
    function ReflectionSection() {
      const [scores, setScores] = useState({ c1: 4, c2: 5, c3: 4, c4: 4 });
      const [notes, setNotes] = useState('헷갈리는 맞춤법(봬요, 률/율)을 국립국어원에서 수시로 찾아보며 바르게 쓰겠습니다.');

      return (
        <div className="bg-white rounded-2xl border border-slate-200 p-6 sm:p-8 shadow-sm space-y-6 max-w-2xl mx-auto">
          <div className="border-b border-slate-100 pb-3">
            <span className="text-xs font-bold text-indigo-600">교과서 166p~167p</span>
            <h2 className="text-xl font-bold text-slate-900">나의 국어생활 성찰 및 자기 점검</h2>
          </div>

          <div className="space-y-3 text-xs">
            {[
              { id: 'c1', text: '1. 일상생활 속 한글 사용의 문제점에 관심을 가진다.' },
              { id: 'c2', text: '2. 한글 맞춤법에 맞게 표기해야 하는 이유(의사소통, 신뢰감)를 안다.' },
              { id: 'c3', text: '3. 헷갈릴 때에는 한글 맞춤법 규정을 찾아본다.' },
              { id: 'c4', text: '4. 글을 쓸 때 어긋난 부분이 없는지 능동적으로 점검한다.' }
            ].map(item => (
              <div key={item.id} className="p-3 bg-slate-50 rounded-xl border flex items-center justify-between gap-3">
                <span className="font-semibold text-slate-700">{item.text}</span>
                <div className="flex gap-1">
                  {[1, 2, 3, 4, 5].map(v => (
                    <button
                      key={v}
                      onClick={() => setScores({ ...scores, [item.id]: v })}
                      className={`w-6 h-6 rounded text-[11px] font-bold ${
                        scores[item.id] === v ? 'bg-indigo-600 text-white' : 'bg-white border text-slate-600'
                      }`}
                    >
                      {v}
                    </button>
                  ))}
                </div>
              </div>
            ))}
          </div>

          <div className="space-y-1.5 text-xs">
            <label className="font-bold text-slate-800">✍️ 나의 실천 다짐:</label>
            <textarea
              value={notes}
              onChange={e => setNotes(e.target.value)}
              rows={3}
              className="w-full p-2.5 border rounded-xl text-xs bg-slate-50 focus:bg-white"
            />
          </div>
        </div>
      );
    }

    // --- 교사용 관리자 대시보드 섹션 ---
    function AdminSection({ submissions, units, quizBank, teacherPin, onUpdatePin, onExportCSV, onAddUnit, onAddQuiz, onMockSubs }) {
      const [newPin, setNewPin] = useState('');
      const [pinMsg, setPinMsg] = useState(false);

      const avgScore = submissions.length > 0
        ? Math.round(submissions.reduce((a, b) => a + b.score, 0) / submissions.length)
        : 0;

      return (
        <div className="space-y-6">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 bg-white p-5 rounded-2xl border shadow-sm">
            <div>
              <span className="text-xs font-bold text-indigo-600">교사용 학습 관리자</span>
              <h2 className="text-xl font-bold text-slate-900">학습 데이터 & 교육과정 대시보드</h2>
            </div>
            <div className="flex gap-2">
              <button
                onClick={onMockSubs}
                className="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-semibold"
              >
                +모의 학생 5명 생성
              </button>
              <button
                onClick={onExportCSV}
                className="px-4 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-xs font-semibold shadow"
              >
                성적표 CSV 다운로드
              </button>
            </div>
          </div>

          {/* 통계 요약 카드 */}
          <div className="grid grid-cols-3 gap-4 text-center">
            <div className="bg-white p-4 rounded-xl border shadow-sm">
              <span className="text-xs text-slate-400">총 제출 건수</span>
              <div className="text-2xl font-black text-slate-900 mt-1">{submissions.length}건</div>
            </div>
            <div className="bg-white p-4 rounded-xl border shadow-sm">
              <span className="text-xs text-slate-400">학급 평균 점수</span>
              <div className="text-2xl font-black text-indigo-600 mt-1">{avgScore}점</div>
            </div>
            <div className="bg-white p-4 rounded-xl border shadow-sm">
              <span className="text-xs text-slate-400">등록 퀴즈 문항수</span>
              <div className="text-2xl font-black text-emerald-600 mt-1">{quizBank.length}문항</div>
            </div>
          </div>

          {/* 전체 학생 제출 기록 테이블 (교사만 열람 가능) */}
          <div className="bg-white rounded-2xl border p-5 shadow-sm space-y-3">
            <h3 className="text-sm font-bold text-slate-900">전체 학생별 제출 기록</h3>
            <div className="overflow-x-auto text-xs">
              <table className="w-full text-left border-collapse">
                <thead>
                  <tr className="bg-slate-50 text-slate-600 border-b">
                    <th className="p-2.5">학생 이름</th>
                    <th className="p-2.5">학급 / 번호</th>
                    <th className="p-2.5">취득 점수</th>
                    <th className="p-2.5">백분율</th>
                    <th className="p-2.5">제출 일시</th>
                  </tr>
                </thead>
                <tbody className="divide-y">
                  {submissions.map(s => (
                    <tr key={s.id} className="hover:bg-slate-50">
                      <td className="p-2.5 font-bold text-slate-900">{s.studentName}</td>
                      <td className="p-2.5 text-slate-600">{s.studentClass}</td>
                      <td className="p-2.5 font-mono font-bold text-slate-800">{s.score}점</td>
                      <td className="p-2.5 font-mono font-bold text-indigo-600">{s.percentage}%</td>
                      <td className="p-2.5 text-slate-400">{s.completedAt}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>

          {/* 교사용 보안 비밀번호 변경 카드 */}
          <div className="bg-white rounded-2xl border p-5 shadow-sm space-y-3">
            <h3 className="text-sm font-bold text-slate-900">교사 전용 비밀번호(PIN) 관리</h3>
            <p className="text-xs text-slate-500">학생들의 무단 접근을 방지하기 위한 비밀번호를 변경합니다. (현재 번호: <strong>{teacherPin}</strong>)</p>
            <form onSubmit={e => {
              e.preventDefault();
              if (newPin.trim().length >= 4) {
                onUpdatePin(newPin.trim());
                setPinMsg(true);
                setNewPin('');
                setTimeout(() => setPinMsg(false), 2000);
              } else {
                alert('4자리 이상 입력해 주세요.');
              }
            }} className="flex gap-2 max-w-xs">
              <input
                type="password"
                value={newPin}
                onChange={e => setNewPin(e.target.value)}
                placeholder="새 비밀번호 입력"
                className="p-2 border rounded-lg text-xs flex-1"
              />
              <button type="submit" className="px-4 py-2 bg-slate-800 text-white font-bold rounded-lg text-xs">
                변경
              </button>
            </form>
            {pinMsg && <span className="text-emerald-600 text-xs font-bold block">✓ 비밀번호가 성공적으로 변경되었습니다.</span>}
          </div>
        </div>
      );
    }

    // React 18 루트 렌더링
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
